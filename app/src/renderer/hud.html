<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>GuaFlow HUD</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .pill {
      display: flex; align-items: center; gap: 10px;
      height: 44px; margin: 10px; padding: 0 14px;
      border-radius: 22px;
      background: rgba(28,28,30,0.92); color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      -webkit-app-region: drag; user-select: none;
      backdrop-filter: blur(12px);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #30d158; flex: none; }
    .dot.recording { background: #ff453a; animation: pulse 1s infinite; }
    .dot.busy { background: #ffd60a; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(1.25);} }
    .label { font-size: 12px; font-weight: 600; white-space: nowrap; }
    .sub { font-size: 10px; opacity: 0.6; }
    .bars { display: flex; align-items: flex-end; gap: 2px; height: 18px; margin-left: auto; }
    .bar { width: 3px; background: #30d158; border-radius: 2px; height: 3px; transition: height 0.08s; }
    .col { display: flex; flex-direction: column; line-height: 1.2; }
  </style>
</head>
<body>
  <div class="pill">
    <div class="dot" id="dot"></div>
    <div class="col">
      <div class="label" id="label">● Local</div>
      <div class="sub" id="sub">Processing on this Mac</div>
    </div>
    <div class="bars" id="bars"></div>
  </div>
  <script src="hud.js"></script>
</body>
</html>
